<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Sprint workshop</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/deck/deck.css">
</head>
<body>
<div id="deck"></div>
<script src="../../shared/deck/deck.js"></script>
<script src="versions/shared/tools.js"></script>
<script src="versions/fall-2025.js"></script>
<script src="versions/spring-2025.js"></script>
<script src="versions/four-day.js"></script>
<script src="versions/shared/pictures.js"></script>
<script>
(function () {
  // The version is a query parameter (?v=four-day) so the presenter window and the projector window open the same one.
  var V = window.DS_VERSIONS, order = ["fall-2025", "spring-2025", "four-day"];
  var want = new URLSearchParams(location.search).get("v"), root = document.getElementById("deck");
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  if (want && V[want]) {
    var v = V[want];
    DS.channel = v.channel;
    document.title = "Design Sprint: " + v.label;
    // Exit goes back to this start page, where the version is picked.
    Deck.start({ title: "Design Sprint: " + v.label, channel: v.channel, langs: ["en"], slides: v.slides, exit: location.pathname });
    return;
  }

  // start page, in the same look as the deck and as cook-a-game (see shared/deck/deck.css)
  root.className = "dk-page";
  root.appendChild(el("div", "dk-row", "<a class='dk-btn' href='../../'>← All materials</a><a class='dk-btn' href='../../readme.html?p=workshops/design-sprint'>About this workshop</a>"));
  root.appendChild(el("h1", "", "Design Sprint workshop"));
  root.appendChild(el("p", "dk-lede", "Pick the version to run. Each one is a slide deck with speaker notes, a plan clock and timers. " +
    "The choice is kept in the address (<code>?v=...</code>), so the presenter view and the projector window show the same deck."));
  if (want) root.appendChild(el("p", "", "<b>Unknown version \"" + want.replace(/[<>&\"]/g, "") + "\".</b> Pick one below."));
  order.forEach(function (id) {
    var x = V[id], c = el("div", "dk-card" + (x.current ? " dk-cur" : ""));
    c.appendChild(el("h2", "", x.label + (x.current ? "<span class='dk-tag'>current</span>" : "")));
    c.appendChild(el("p", "", x.summary));
    var links = el("div", "dk-row");
    links.innerHTML = "<a class='dk-btn dk-primary' href='?v=" + id + "'>Open the slides</a>" +
      "<a class='dk-btn' href='?v=" + id + "#presenter'>Presenter view</a>" +
      "<span class='dk-label'>Start at</span>" +
      "<a class='dk-btn' href='?v=" + id + "&amp;s=day1/open'>day 1</a><a class='dk-btn' href='?v=" + id + "&amp;s=day2/open'>day 2</a>" +
      "<a class='dk-btn' href='?v=" + id + "&amp;s=day3/open'>day 3</a><a class='dk-btn' href='?v=" + id + "&amp;s=day4/open'>day 4</a>";
    c.appendChild(links);
    root.appendChild(c);
  });
  root.appendChild(el("p", "dk-lede", "In the presenter view use the button to open the slide window for the projector. " +
    "The plan clock adds up the planned minutes of all days, so for a single day jump to its start with the buttons above."));
})();
</script>
</body>
</html>
